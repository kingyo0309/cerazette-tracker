<!doctype html><link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png"><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5f4"><meta name="apple-mobile-web-app-capable" content="yes"><title>わたしの服薬シート</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#343044;background:#f8f5f4}*{box-sizing:border-box}body{margin:0}main{max-width:490px;margin:auto;padding:32px 19px 65px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:#9686a8}.header{display:flex;align-items:center;justify-content:space-between;margin-top:8px}h1{font-size:25px;letter-spacing:-.05em;margin:0;font-weight:750}.todaydate{font-size:12px;color:#898293;margin:10px 0 22px}.flower{width:41px;height:41px;border-radius:14px;background:#eee6f1;display:grid;place-items:center;color:#8a6e9d;font-size:24px}.panel{background:#fff;border:1px solid #f0e9ee;border-radius:23px;padding:20px;box-shadow:0 12px 35px #57445a0a;margin-top:14px}.sectiontitle{font-size:12px;color:#8c8293;font-weight:650;margin-bottom:9px}.time-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.time-row strong{font-size:19px}.time-input{font:700 18px inherit;font-size:18px;font-weight:700;color:#725887;background:#f6f0f8;border:1px solid #e9ddeb;border-radius:12px;padding:9px;max-width:142px}.hint{font-size:11px;color:#958b9c;line-height:1.6;margin:10px 0 0}.sheet{padding:21px 14px 24px}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:0 7px}.sheethead strong{font-size:15px}.count{color:#8d779c;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px 5px;margin:30px 0 26px}.pill{width:100%;aspect-ratio:1;border-radius:50%;border:1.5px solid #ddd5e2;background:radial-gradient(circle at 32% 24%,#fff,#f5f1f6);color:#897f90;position:relative;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 4px #453c4610}.pill.done{background:#9981ac;color:white;border-color:#9981ac;box-shadow:none}.pill.today{outline:2px solid #d39b91;outline-offset:3px}.pill small{position:absolute;left:-4px;right:-4px;bottom:-17px;font-size:9px;color:#a19aa5;font-weight:500}.legend{display:flex;gap:17px;font-size:11px;color:#908696;padding:0 6px}.legend b{color:#9981ac}.legend .current{color:#d39b91}.status{margin-top:22px;padding:15px 14px;border-radius:14px;background:#f7f2f9;color:#705a81;font-size:13px;font-weight:700;text-align:center;line-height:1.6}.status.warn{background:#fff0ed;color:#a65f54}.startrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.startrow label{font-size:12px;color:#77707d}.startrow input{font:inherit;font-size:13px;border:1px solid #e8e0e9;border-radius:9px;padding:9px;color:#67556e;background:#fff;max-width:156px}.controls{display:flex;gap:10px;margin:15px 0}.control{flex:1;border:1px solid #e6dce7;border-radius:13px;background:#fff;padding:14px 7px;color:#786687;font-size:13px;font-weight:700}.note{font-size:11px;line-height:1.8;color:#8c8490;margin:22px 4px}dialog{border:0;border-radius:20px;padding:23px;width:calc(100% - 42px);max-width:350px;color:#343044;box-shadow:0 22px 60px #24152c35}dialog::backdrop{background:#241a2b75}dialog p{line-height:1.7;font-size:13px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:1px solid #e5dbe8;background:white;border-radius:12px;padding:12px;font-weight:700;color:#725c80}.actions .primary{background:#8e76a2;color:white;border:0}button:focus-visible,input:focus-visible{outline:3px solid #b69ac8;outline-offset:3px}
</style></head><body><main><div class="eyebrow">MY DAILY CARE</div><div class="header"><h1>わたしの服薬シート</h1><div class="flower" aria-hidden="true">✿</div></div><div class="todaydate" id="date"></div><section class="panel"><div class="sectiontitle">毎日の服薬予定時刻</div><div class="time-row"><strong>リマインダー設定</strong><input class="time-input" id="doseTime" type="time" value="12:00" aria-label="毎日の服薬予定時刻"></div><p class="hint">時刻はいつでも変更できます。設定した時刻を過ぎて未記録の場合、アプリを開くとお知らせします。</p></section><section class="panel sheet"><div class="sheethead"><strong id="pack">シート 1</strong><span class="count" id="progress">0 / 28 錠</span></div><div class="grid" id="grid"></div><div class="legend"><span><b>●</b> 服薬済み</span><span><b class="current">◎</b> 今日の錠剤</span></div><div class="status" id="status" role="status"></div></section><section class="panel"><div class="startrow"><label for="startDate">シートの1錠目の日付</label><input id="startDate" type="date"></div></section><div class="controls"><button class="control" id="prev">← 前のシート</button><button class="control" id="next">次のシート →</button></div><p class="note">錠剤をタップして服薬記録をつけられます。服薬記録はこの端末のブラウザ内に保存されます。端末の変更やブラウザデータの削除で失われることがあります。現段階では、アプリを閉じている間のプッシュ通知はありません。服薬時刻にはiPhoneのアラームも併用してください。服薬の遅れや飲み忘れへの対応は処方医・薬剤師の指示に従ってください。</p></main><dialog id="dialog"><strong id="dialogTitle"></strong><p id="dialogText"></p><div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="confirm">確定</button></div></dialog><script>
const KEY='pill-sheet-v2',localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state||typeof state!=='object')state={};state.start=state.start||localDay(new Date());state.records=state.records||{};state.pack=Number.isInteger(state.pack)&&state.pack>=0?state.pack:0;state.doseTime=/^([01]\d|2[0-3]):[0-5]\d$/.test(state.doseTime||'')?state.doseTime:'12:00';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));let start=new Date(state.start+'T12:00:00');const grid=document.getElementById('grid'),dialog=document.getElementById('dialog'),startDateInput=document.getElementById('startDate'),doseTimeInput=document.getElementById('doseTime');startDateInput.value=state.start;doseTimeInput.value=state.doseTime;doseTimeInput.onchange=()=>{if(doseTimeInput.value){state.doseTime=doseTimeInput.value;save();render()}};startDateInput.onchange=()=>{if(!startDateInput.value)return;if(Object.keys(state.records).length&&!confirm('開始日を変更すると、これまでの服薬記録を消去します。変更しますか？')){startDateInput.value=state.start;return}state.start=startDateInput.value;state.records={};state.pack=0;start=new Date(state.start+'T12:00:00');save();render()};function render(){const now=new Date(),today=localDay(now);document.getElementById('date').textContent=new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(now);grid.innerHTML='';let count=0;for(let i=0;i<28;i++){const n=state.pack*28+i,date=new Date(start);date.setDate(date.getDate()+n);const day=localDay(date),done=!!state.records[n];if(done)count++;const b=document.createElement('button');b.type='button';b.className='pill'+(done?' done':'')+(day===today?' today':'');b.innerHTML=(done?'✓':i+1)+`<small>${date.getMonth()+1}/${date.getDate()}</small>`;b.setAttribute('aria-label',`${i+1}錠目 ${day} ${done?'服薬済み':'未記録'}`);b.onclick=()=>edit(n,day,done);grid.appendChild(b)}document.getElementById('pack').textContent=`シート ${state.pack+1}`;document.getElementById('progress').textContent=`${count} / 28 錠`;const t=Math.round((new Date(today+'T12:00:00')-start)/86400000),rec=state.records[t],status=document.getElementById('status');status.classList.remove('warn');if(t<0)status.textContent='シートの開始日前です';else if(rec)status.textContent=`今日の分は記録済み · ${new Date(rec).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;else if(now>=new Date(`${today}T${state.doseTime}:00`)){status.textContent=`${state.doseTime}の服薬予定時刻を過ぎています · 未記録`;status.classList.add('warn')}else status.textContent=`今日の分は未記録 · 予定 ${state.doseTime}`;}function edit(n,day,done){document.getElementById('dialogTitle').textContent=`${day} の服薬記録`;document.getElementById('dialogText').textContent=done?'この錠剤の服薬記録を取り消しますか？':'実際にこの錠剤を飲みましたか？ 記録時刻は現在の時刻になります。';document.getElementById('confirm').textContent=done?'記録を取り消す':'服薬済みにする';document.getElementById('confirm').onclick=()=>{if(done)delete state.records[n];else state.records[n]=new Date().toISOString();save();dialog.close();render()};dialog.showModal()}document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>{if(state.pack>0){state.pack--;save();render()}};document.getElementById('next').onclick=()=>{state.pack++;save();render()};render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!document.hidden)render()},60000);
</script></body></html>
