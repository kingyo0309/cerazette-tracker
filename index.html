<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9f2ec"><title>服薬シート</title><style>body{margin:0;background:#f3f6f3;color:#253d32;font-family:system-ui,-apple-system,sans-serif}main{max-width:440px;margin:auto;padding:24px 18px}h1{font-size:24px;margin:6px 0}.sub{color:#728277;font-size:13px}.sheet{background:white;border-radius:24px;padding:20px 16px;box-shadow:0 8px 30px #2a493015;margin-top:24px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:13px 5px;margin:26px 0 18px}.pill{aspect-ratio:1;border-radius:50%;border:2px solid #c7d6cd;background:linear-gradient(135deg,#fff,#eef1ee);box-shadow:inset -2px -3px 4px #dce5df,0 2px 4px #0001;font-size:13px;color:#69796d;cursor:pointer;position:relative}.pill.done{background:#5c9d7a;color:white;border-color:#5c9d7a;box-shadow:none}.pill.today{outline:3px solid #e4b963;outline-offset:3px}.pill small{display:block;font-size:9px;position:absolute;bottom:-14px;left:0;right:0;color:#839187}.pill.done small{color:#839187}.legend{font-size:12px;display:flex;gap:16px;color:#6b8072}.status{padding:16px;background:#edf5ef;border-radius:14px;margin-top:18px;font-weight:600;text-align:center}.controls{display:flex;gap:8px;margin-top:18px}button.control{flex:1;background:white;border:1px solid #c9d8cd;border-radius:12px;padding:12px;color:#365b44;font-weight:600}.note{font-size:12px;color:#7b887e;line-height:1.6;margin-top:20px}dialog{border:0;border-radius:18px;padding:24px;max-width:310px;box-shadow:0 15px 60px #0003}dialog::backdrop{background:#172b2080}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;padding:11px;border-radius:10px;border:1px solid #b6c8bc;background:white}.actions .primary{background:#448765;color:white;border:0}</style></head><body><main><div class="sub">毎日の服薬を、シートで記録</div><h1>わたしの服薬シート</h1><div class="sub" id="date"></div><div style="margin-top:16px;font-size:13px">シートの1錠目の日付： <input id="startDate" type="date" style="font-size:16px;padding:8px;border:1px solid #c9d8cd;border-radius:8px"></div><section class="sheet"><div class="top"><strong id="pack">シート 1</strong><span class="sub" id="progress">0 / 28 錠</span></div><div class="grid" id="grid"></div><div class="legend"><span>● 服薬済み</span><span>◎ 今日の錠剤</span></div><div class="status" id="status"></div></section><div class="controls"><button class="control" id="prev">← 前のシート</button><button class="control" id="next">次のシート →</button></div><p class="note">開始日は実際に今のシートの1錠目を飲んだ日に設定してください。過去の錠剤を記録する場合、記録日時は操作した日時になります。記録はこの端末のブラウザ内に保存されます。ブラウザデータを削除すると消える場合があります。服薬判断や飲み忘れ時の対応は処方医・薬剤師の指示を優先してください。</p></main><dialog id="dialog"><strong id="dialogTitle"></strong><p id="dialogText"></p><div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="confirm">確定</button></div></dialog><script>const KEY='pill-sheet-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{start:new Date().toLocaleDateString('sv-SE'),records:{},pack:0}}catch{state={start:new Date().toLocaleDateString('sv-SE'),records:{},pack:0}};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let start=new Date(state.start+'T12:00:00');const today=localDay(new Date());document.getElementById('date').textContent=new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date());const grid=document.getElementById('grid'),dialog=document.getElementById('dialog');const startDateInput=document.getElementById('startDate');startDateInput.value=state.start;startDateInput.onchange=()=>{if(Object.keys(state.records).length&&!confirm('開始日を変更すると、これまでの記録を消去します。変更しますか？')){startDateInput.value=state.start;return;}state.start=startDateInput.value;state.records={};state.pack=0;start=new Date(state.start+'T12:00:00');save();render()};function render(){grid.innerHTML='';let count=0;for(let i=0;i<28;i++){let n=state.pack*28+i;let date=new Date(start);date.setDate(date.getDate()+n);let day=localDay(date),done=!!state.records[n];if(done)count++;let b=document.createElement('button');b.className='pill'+(done?' done':'')+(day===today?' today':'');b.innerHTML=(done?'✓':i+1)+`<small>${date.getMonth()+1}/${date.getDate()}</small>`;b.setAttribute('aria-label',`${i+1}錠目 ${day} ${done?'服薬済み':'未記録'}`);b.onclick=()=>edit(n,day,done);grid.appendChild(b)}document.getElementById('pack').textContent=`シート ${state.pack+1}`;document.getElementById('progress').textContent=`${count} / 28 錠`;let t=Math.round((new Date(today+'T12:00:00')-start)/86400000),rec=state.records[t];document.getElementById('status').textContent=t<0?'開始日より前です':rec?`今日の分：記録済み（${new Date(rec).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}）`:'今日の分：未記録'}function edit(n,day,done){document.getElementById('dialogTitle').textContent=`${day} の服薬記録`;document.getElementById('dialogText').textContent=done?'この錠剤の服薬記録を取り消しますか？':'この錠剤を服薬済みにしますか？';document.getElementById('confirm').textContent=done?'記録を取り消す':'服薬済みにする';document.getElementById('confirm').onclick=()=>{if(done)delete state.records[n];else state.records[n]=new Date().toISOString();save();dialog.close();render()};dialog.showModal()}document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>{if(state.pack>0){state.pack--;save();render()}};document.getElementById('next').onclick=()=>{state.pack++;save();render()};render();</script></body></html>
